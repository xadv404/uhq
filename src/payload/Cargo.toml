[package]
name = "chrome-payload"
version = "1.0.0"
edition = "2021"

[lib]
name = "chrome_payload"
crate-type = ["cdylib"]

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[build-dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
